name: Triage agent e2e

# Files real test issues as github-actions[bot], so GitHub delivers the real webhook to the
# maintainer's T3 triage task (through Tailscale Funnel), and checks what the agent did on GitHub.
# Needs the maintainer's Mac and T3 running. Run it from the Actions tab; delete the issues
# afterwards with `GH_TOKEN=$(gh auth token) node scripts/triage-e2e/run.mjs cleanup`.
on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/triage-e2e

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: File the cases and check the triage
        run: node scripts/triage-e2e/run.mjs run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
